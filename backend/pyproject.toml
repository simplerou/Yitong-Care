[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yitong-care-backend"
version = "0.1.0"
description = "颐养通 FastAPI 服务与 MySQL 数据层"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0.36,<2.1",
    "PyMySQL[rsa]>=1.1.1,<2",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<7",
    "defusedxml>=0.7,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "jieba>=0.42.1,<0.43",
    "faiss-cpu>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
